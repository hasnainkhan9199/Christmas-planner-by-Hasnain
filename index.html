    const icon=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${iconPaths[n]||iconPaths.tree}</svg>`;
    function hydrateIcons(root=document){$$('[data-icon]',root).forEach(el=>el.innerHTML=icon(el.dataset.icon))}
    function blankState(){return {version:VERSION,onboarded:false,profile:{name:"",household:"Our Christmas",christmasDate:nextChristmas()},settings:{theme:"light",currency:"USD",motion:true,surprise:false,demoMode:FORCE_DEMO_MODE},energy:{},budget:{total:1500},tasks:[],gifts:[],expenses:[],deals:[],orders:[],meals:[],groceries:[],guests:[],cards:[],decor:[],brain:[],activity:[],createdAt:new Date().toISOString()}}
    function normalize(raw){const b=blankState(),s=raw&&typeof raw==="object"?raw:{};return {...b,...s,version:VERSION,profile:{...b.profile,...(s.profile||{})},settings:{...b.settings,...(s.settings||{}),demoMode:FORCE_DEMO_MODE},budget:{...b.budget,...(s.budget||{})},energy:s.energy&&typeof s.energy==="object"?s.energy:{},tasks:Array.isArray(s.tasks)?s.tasks:[],gifts:Array.isArray(s.gifts)?s.gifts:[],expenses:Array.isArray(s.expenses)?s.expenses:[],deals:Array.isArray(s.deals)?s.deals:[],orders:Array.isArray(s.orders)?s.orders:[],meals:Array.isArray(s.meals)?s.meals:[],groceries:Array.isArray(s.groceries)?s.groceries:[],guests:Array.isArray(s.guests)?s.guests:[],cards:Array.isArray(s.cards)?s.cards:[],decor:Array.isArray(s.decor)?s.decor:[],brain:Array.isArray(s.brain)?s.brain:[],activity:Array.isArray(s.activity)?s.activity:[]}}
    function load(){try{const raw=localStorage.getItem(STORAGE_KEY);return raw?normalize(JSON.parse(raw)):blankState()}catch(e){return blankState()}}
    let state=load(),screen="home",shoppingTab="deals",hostingTab="meals",cardsTab="cards",giftSearch="",giftFilter="all",confirmAction=null,pendingImport=null,storageWorks=true;
    function save(show=true){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));storageWorks=true;if(show){const el=$("#saveStatus");if(el){el.textContent="Saved ✓";setTimeout(()=>{if(el)el.textContent="Auto-saved"},850)}}}catch(e){storageWorks=false;toast("Browser storage is unavailable. Download a backup before closing.","⚠️")}}
    function daysToChristmas(){const a=fromISO(today()),b=fromISO(state.profile.christmasDate||nextChristmas());return Math.ceil((b-a)/86400000)}
    function countdownCopy(){const d=daysToChristmas();return d>1?`${d} days to Christmas`:d===1?"Christmas is tomorrow":d===0?"Merry Christmas!":`${Math.abs(d)} days since Christmas`}
    function holidayProgress(){const target=fromISO(state.profile.christmasDate),start=new Date(target.getFullYear(),8,1,12),now=fromISO(today());return clamp(Math.round((now-start)/(target-start)*100),0,100)}
    function currentEnergy(){return state.energy[today()]||"medium"}
    function openTasks(){return state.tasks.filter(t=>!t.done)}
    function nextTask(){const rank=ENERGY[currentEnergy()].rank,items=openTasks().filter(t=>(ENERGY[t.energy]?.rank||2)<=rank);return (items.length?items:openTasks()).sort((a,b)=>(a.due||"9999-12-31").localeCompare(b.due||"9999-12-31")||(ENERGY[a.energy]?.rank||2)-(ENERGY[b.energy]?.rank||2)||String(a.createdAt).localeCompare(String(b.createdAt)))[0]}
    function budgetStats(){const gifts=state.gifts.filter(g=>g.purchased).reduce((n,g)=>n+moneyNum(g.price),0),groceries=state.groceries.filter(g=>g.purchased).reduce((n,g)=>n+moneyNum(g.cost),0),expenses=state.expenses.reduce((n,x)=>n+moneyNum(x.amount),0),spent=gifts+groceries+expenses,total=moneyNum(state.budget.total),remaining=total-spent;return {gifts,groceries,expenses,spent,total,remaining,percent:total?clamp(spent/total*100,0,100):0}}
    function giftStage(g){return g.wrapped?"wrapped":g.delivered?"delivered":g.purchased?"purchased":"idea"}
    function logActivity(kind,label,emoji="✨"){state.activity.unshift({id:uid("act"),kind,label,emoji,date:today(),createdAt:new Date().toISOString()});state.activity=state.activity.slice(0,200)}
    function demoBlocked(kind){if(!state.settings.demoMode)return false;const limit=DEMO_LIMITS[kind],count=kind==="tasks"?state.tasks.length:state.gifts.length;if(count>=limit){toast(`Demo limit reached: ${limit} ${kind}. Turn off Seller Demo Mode for the full planner.`,"🔒");return true}return false}
    function toast(message,emoji="✨"){const el=document.createElement("div");el.className="toast";el.innerHTML=`<i>${emoji}</i><span>${esc(message)}</span>`;$("#toastZone").append(el);setTimeout(()=>el.remove(),3400)}
    function celebrate(){if(!state.settings.motion)return;const fx=$("#fx"),colors=["#1f5745","#a8474d","#b88735","#f5f1df"];for(let i=0;i<22;i++){const c=document.createElement("i");c.className="confetti";c.style.setProperty("--x",`${Math.random()*100}%`);c.style.setProperty("--dx",`${(Math.random()-.5)*180}px`);c.style.setProperty("--t",`${1.4+Math.random()*1.8}s`);c.style.setProperty("--c",colors[i%colors.length]);fx.append(c);setTimeout(()=>c.remove(),3500)}}
    function demoBanner(){return state.settings.demoMode?`<div class="demo-banner"><div><strong>Seller Demo Mode</strong><div>This copy allows up to ${DEMO_LIMITS.tasks} tasks and ${DEMO_LIMITS.gifts} gifts. Nothing existing is removed.</div></div><button class="btn btn-small btn-gold" type="button" data-action="navigate" data-screen="settings">Demo settings</button></div>`:""}
    function renderChrome(){const d=daysToChristmas(),progress=holidayProgress(),p=PAGE[screen]||PAGE.home;document.body.dataset.theme=state.settings.theme;document.body.classList.toggle("no-motion",!state.settings.motion);document.body.classList.toggle("surprise",!!state.settings.surprise);$("#familyCard").innerHTML=`<div class="family-icon">🎄</div><div><strong>${esc(state.profile.household||"Our Christmas")}</strong><span>${esc(state.profile.name||"Holiday planner")}</span></div>`;const badges={tasks:openTasks().length,gifts:state.gifts.filter(g=>!g.wrapped).length,shopping:state.orders.filter(o=>!o.delivered).length};$("#sideNav").innerHTML=`<div class="nav-label">Plan the season</div>${NAV.map(([id,label,ic])=>`<button class="nav-btn ${screen===id?"active":""}" type="button" data-action="navigate" data-screen="${id}">${icon(ic)}<span>${label}</span>${badges[id]?`<span class="nav-badge">${badges[id]}</span>`:""}</button>`).join("")}`;$("#sideCount").innerHTML=`<span>Christmas countdown</span><strong>${d>=0?d:0} day${Math.abs(d)===1?"":"s"}</strong><div class="meter"><span style="width:${progress}%"></span></div>`;$("#pageEyebrow").textContent=p[0];$("#pageTitle").textContent=p[1];$("#topCenter").innerHTML=`<div class="count-chip"><i>🎄</i><div><small>${fmtDate(state.profile.christmasDate,{day:"numeric",month:"short",year:"numeric"})}</small><strong>${countdownCopy()}</strong></div></div><div class="save-chip" id="saveStatus">Auto-saved</div>`;const mobile=[NAV[0],NAV[1],NAV[2],NAV[3],["more","More","menu"]];$("#mobileNav").innerHTML=mobile.map(([id,label,ic])=>`<button type="button" class="${screen===id||id==="more"&&["shopping","hosting","cards","brain","settings"].includes(screen)?"active":""}" data-action="${id==="more"?"mobile-more":"navigate"}" ${id!=="more"?`data-screen="${id}"`:""}>${icon(ic)}<span>${label}</span></button>`).join("");const eye=$("[data-action='toggle-surprise'] [data-icon]");if(eye)eye.dataset.icon=state.settings.surprise?"eyeoff":"eye";hyd     function render(){renderChrome();const root=$("#main"),fn={home:renderHome,tasks:renderTasks,gifts:renderGifts,budget:renderBudget,shopping:renderShopping,hosting:renderHosting,cards:renderCardsDecor,brain:renderBrain,settings:renderSettings}[screen]||renderHome;root.innerHTML=fn();hydrateIcons(root);root.focus({preventScroll:true});renderOnboarding()}
    function renderOnboarding(){const wrap=$("#onboarding");if(state.onboarded){wrap.hidden=true;wrap.innerHTML="";return}wrap.hidden=false;wrap.innerHTML=`<div class="scrim"></div><section class="welcome" role="dialog" aria-modal="true" aria-labelledby="welcomeTitle"><div class="welcome-art"><div><div class="welcome-brand"><div class="brand-mark">${icon("tree")}</div><div><strong>Christmas Command Center</strong><div style="font-size:.72rem;color:rgba(255,255,255,.7)">a calmer holiday starts here</div></div></div><h1 id="welcomeTitle">Make Christmas feel lighter.</h1><p>Bring gifts, money, meals, deliveries and every loose thought into one quiet place — then choose only the next useful step.</p><div class="feature-chips"><span class="feature-chip">Private &amp; offline</span><span class="feature-chip">Automatic saving</span><span class="feature-chip">ADHD-friendly energy modes</span></div></div><small style="color:rgba(255,255,255,.65)">Works on computer, tablet and mobile. No account required.</small></div><form class="welcome-form" data-form="onboarding"><h2>Set up your Christmas</h2><p>You can change these details later in Settings.</p><div class="form-grid"><div class="field full"><label for="setupName">Your name or nickname</label><input class="input" id="setupName" name="name" maxlength="40" required placeholder="e.g. Hasnain"></div><div class="field full"><label for="setupHousehold">Planner name</label><input class="input" id="setupHousehold" name="household" maxlength="60" value="Our Christmas" required></div><div class="field"><label for="setupDate">Christmas date</label><input class="input" id="setupDate" name="christmasDate" type="date" value="${esc(state.profile.christmasDate)}" required></div><div class="field"><label for="setupCurrency">Currency</label><select class="select" id="setupCurrency" name="currency">${Object.entries(CURRENCIES).map(([k,v])=>`<option value="${k}" ${k===state.settings.currency?"selected":""}>${v[0]} ${v[1]}</option>`).join("")}</select></div><div class="field full"><label for="setupBudget">Holiday budget</label><input class="input" id="setupBudget" name="budget" type="number" min="0" step="0.01" value="1500"><small>This is a planning limit, not a bank connection.</small></div></div><div class="modal-foot"><button class="btn btn-primary" type="submit">Open my command center</button></div></form></section>`}
    function renderHome(){const b=budgetStats(),n=nextTask(),wrapped=state.gifts.filter(g=>g.wrapped).length,openOrders=state.orders.filter(o=>!o.delivered).length,done=state.tasks.filter(t=>t.done).length,progress=state.tasks.length?Math.round(done/state.tasks.length*100):0,timeline=getTimeline().slice(0,6);return `<section class="screen">${demoBanner()}<div class="grid grid-main"><div class="stack"><article class="card holiday-hero"><div><div class="micro">${new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})}</div><h2>${countdownCopy()}</h2><p>Welcome, ${esc(state.profile.name||"friend")}. Your whole holiday does not need attention right now—only one kind next step.</p><div class="hero-actions"><button class="btn btn-primary" type="button" data-action="go-next">Show my next task</button><button class="btn" type="button" data-action="open-brain">Quick brain dump</button></div></div><div class="countdown-dial" style="--progress:${holidayProgress()}"><div class="dial-copy"><strong>${Math.max(0,daysToChristmas())}</strong><span>days remaining</span><small>${fmtDate(state.profile.christmasDate,{day:"numeric",month:"long"})}</small></div></div></article><div class="kpis"><div class="kpi"><span>Tasks complete</span><strong>${progress}%</strong><small>${done} of ${state.tasks.length}</small></div><div class="kpi"><span>Gifts wrapped</span><strong>${wrapped}/${state.gifts.length}</strong><small>${state.gifts.filter(g=>!g.wrapped).length} still open</small></div><div class="kpi"><span>Budget remaining</span><strong class="private-value ${b.remaining<0?"negative":"positive"}">${money(b.remaining)}</strong><small>${Math.round(b.percent)}% used</small></div><div class="kpi"><span>Deliveries open</span><strong>${openOrders}</strong><small>${state.orders.filter(o=>o.delivered).length} arrived</small></div></div>${renderNextCard(n)}<article class="card"><div class="card-head"><div><h2 class="card-title">Coming up</h2><p class="card-sub">Tasks, deliveries, deals and events in date order.</p></div><button class="btn btn-small btn-soft" type="button" data-action="navigate" data-screen="tasks">View tasks</button></div>${timeline.length?`<div class="timeline">${timeline.map(x=>`<div class="timeline-item"><strong>${esc(x.title)}</strong><span>${fmtDate(x.date)} · ${esc(x.type)}</span></div>`).join("")}</div>`:empty("📅","Nothing scheduled yet","Add dates to tasks, orders, deals or meals.")}</article></div><aside class="stack">${renderEnergyCard()}<article class="card"><div class="card-head"><div><h2 class="card-title">Quick actions</h2><p class="card-sub">Go straight to the useful part.</p></div></div><div class="quick-grid"><button class="quick" type="button" data-action="add-gift">🎁<b>Add a gift</b><span>Person, price and hiding place</span></button><button class="quick" type="button" data-action="add-order">📦<b>Track an order</b><span>ETA and delivery status</span></button><button class="quick" type="button" data-action="add-grocery">🛒<b>Add grocery</b><span>Build the food list</span></button><button class="quick" type="button" data-action="add-expense">💰<b>Log expense</b><span>Keep budget current</span></button></div></article><article class="card"><div class="card-head"><div><h2 class="card-title">Holiday pulse</h2><p class="card-sub">A quick look without opening every screen.</p></div></div>${progressBar("Tasks",done,state.tasks.length,varColor("green"))}${progressBar("Purchased gifts",state.gifts.filter(g=>g.purchased).length,state.gifts.length,varColor("red"))}${progressBar("Wrapped gifts",wrapped,state.gifts.length,varColor("gold"))}${progressBar("Cards sent",state.cards.filter(c=>c.status==="sent").length,state.cards.length,varColor("blue"))}</article><article class="card"><div class="card-head"><div><h2 class="card-title">Recent activity</h2><p class="card-sub">Your latest holiday wins.</p></div></div><div class="row-list">${state.activity.slice(0,5).map(activityRow).join("")||empty("✨","Your log is rea     function renderNextCard(t){if(!t)return `<article class="card next-card"><div class="card-head"><div><h2 class="card-title">One next task</h2><p class="card-sub">Matched to your current energy.</p></div></div>${empty("🌟","Your task list is clear","Add one small Christmas task when it comes to mind.")}</article>`;const e=ENERGY[t.energy]||ENERGY.medium,c=CATEGORY[t.category]||CATEGORY.other;return `<article class="card next-card" id="nextTaskCard"><div class="card-head"><div><h2 class="card-title">One next task</h2><p class="card-sub">Chosen for ${e.name.toLowerCase()} energy and the nearest due date.</p></div><button class="btn btn-small btn-soft" type="button" data-action="navigate" data-screen="tasks">Task board</button></div><div class="next-task"><button class="big-check" type="button" data-action="toggle-task" data-id="${t.id}" aria-label="Complete ${esc(t.title)}">${icon("check")}</button><div class="next-main"><strong>${esc(t.title)}</strong>${t.notes?`<p>${esc(t.notes)}</p>`:""}<div class="tag-row"><span class="tag">${e.icon} ${e.name} energy</span><span class="tag">${c[1]} ${c[0]}</span>${t.due?`<span class="tag ${t.due<today()?"warn":""}">📅 ${fmtDate(t.due)}</span>`:""}</div></div></div></article>`}
    function renderEnergyCard(){const current=currentEnergy();return `<article class="card"><div class="card-head"><div><h2 class="card-title">What can you carry today?</h2><p class="card-sub">This changes the suggested task, not your full list.</p></div></div><div class="energy-buttons">${Object.entries(ENERGY).map(([id,e])=>`<button class="energy-btn ${current===id?"active":""}" type="button" data-action="set-energy" data-value="${id}"><strong>${e.icon} ${e.name}</strong><span>${e.copy}</span></button>`).join("")}</div></article>`}
    function getTimeline(){const items=[];state.tasks.filter(t=>!t.done&&t.due).forEach(t=>items.push({date:t.due,title:t.title,type:"Task"}));state.orders.filter(o=>!o.delivered&&o.eta).forEach(o=>items.push({date:o.eta,title:o.item,type:"Delivery"}));state.deals.filter(d=>d.status==="watching"&&d.deadline).forEach(d=>items.push({date:d.deadline,title:d.item,type:"Deal deadline"}));state.meals.filter(m=>m.date).forEach(m=>items.push({date:m.date,title:m.name,type:m.type||"Meal"}));return items.sort((a,b)=>a.date.localeCompare(b.date))}

    function empty(emoji,title,copy){return `<div class="empty"><div class="empty-icon">${emoji}</div><strong>${title}</strong><span>${copy}</span></div>`}
    function renderTasks(){const categories=Object.entries(CATEGORY);return `<section class="screen">${demoBanner()}<div class="toolbar"><div><strong>Master Christmas list</strong><div class="card-sub">Sort by the energy the task needs, not how guilty it feels.</div></div><button class="btn btn-primary" type="button" data-action="add-task">${icon("plus")} Add task</button></div><div class="grid task-board">${Object.entries(ENERGY).map(([energy,e])=>{const items=state.tasks.filter(t=>t.energy===energy);return `<article class="card task-column"><div class="column-head"><div class="column-icon">${e.icon}</div><div class="column-copy"><h2>${e.name} energy</h2><span>${e.copy}</span></div><span class="count-pill">${items.length}</span></div><div class="task-list">${items.map(renderTaskCard).join("")||empty("❄️","No tasks here","Add something that matches this energy level.")}<button class="btn btn-ghost" type="button" data-action="add-task-energy" data-energy="${energy}">${icon("plus")} Add ${e.name.toLowerCase()}-energy task</button></div></article>`}).join("")}</div></section>`}
    function renderTaskCard(t){const done=!!t.done,e=ENERGY[t.energy]||ENERGY.medium,c=CATEGORY[t.category]||CATEGORY.other,overdue=t.due&&t.due<today()&&!done;return `<div class="task ${done?"done":""}" data-task="${t.id}"><div class="task-top"><button class="task-check" type="button" data-action="toggle-task" data-id="${t.id}" aria-label="${done?"Undo":"Complete"} ${esc(t.title)}">${done?icon("check"):""}</button><div class="task-main"><strong>${esc(t.title)}</strong>${t.notes?`<p>${esc(t.notes)}</p>`:""}</div><div class="task-tools"><button class="mini-icon" type="button" data-action="edit-task" data-id="${t.id}" aria-label="Edit task">${icon("edit")}</button><button class="mini-icon" type="button" data-action="delete-task" data-id="${t.id}" aria-label="Delete task">${icon("trash")}</button></div></div><div class="task-foot"><span class="tag">${c[1]} ${c[0]}</span>${t.due?`<span class="tag ${overdue?"warn":""}">📅 ${overdue?"Overdue · ":""}${fmtDate(t.due)}</span>`:""}</div></div>`}
    function renderGifts(){const q=giftSearch.toLowerCase(),items=state.gifts.filter(g=>(!q||[g.person,g.idea,g.store,g.hidden].some(x=>String(x||"").toLowerCase().includes(q)))&&(giftFilter==="all"||giftStage(g)===giftFilter));const duplicates=new Set();state.gifts.forEach((a,i)=>state.gifts.slice(i+1).forEach(b=>{if(String(a.person||"").trim().toLowerCase()===String(b.person||"").trim().toLowerCase()&&String(a.idea||"").trim().toLowerCase()===String(b.idea||"").trim().toLowerCase()){duplicates.add(a.id);duplicates.add(b.id)}}));return `<section class="screen">${demoBanner()}<article class="card"><div class="card-head"><div><h2 class="card-title">Gift Workshop</h2><p class="card-sub">Ideas, prices and every step from purchase to wrapping.</p></div><div class="button-row"><span class="status">${state.gifts.filter(g=>g.wrapped).length}/${state.gifts.length} wrapped</span></div></div><div class="gift-toolbar"><label class="search"><span class="sr-only">Search gifts</span>${icon("search")}<input class="input" id="giftSearch" value="${esc(giftSearch)}" placeholder="Search person, gift or store…"></label><select class="select" id="giftFilter" aria-label="Filter gift status"><option value="all" ${giftFilter==="all"?"selected":""}>All gifts</option><option value="idea" ${giftFilter==="idea"?"selected":""}>Ideas</option><option value="purchased" ${giftFilter==="purchased"?"selected":""}>Purchased</option><option value="delivered" ${giftFilter==="delivered"?"selected":""}>Delivered</option><option value="wrapped" ${giftFilter==="wrapped"?"selected":""}>Wrapped</option></select><button class="btn btn-red" type="button" data-action="add-gift">${icon("plus")} Add gift</button></div><div class="gift-grid">${items.map(g=>renderGiftCard(g,duplicates.has(g.id))).join("")||empty("🎁",q||giftFilter!=="all"?"No matching gifts":"No gifts yet",q||giftFilter!=="all"?"Try another search or filter.":"Add a person and one gift idea.")}</div></article></section>`}
    function renderGiftCard(g,duplicate){return `<article class="gift-card ${g.wrapped?"complete":""}" data-gift="${g.id}"><div class="gift-tools"><button class="mini-icon" type="button" data-action="edit-gift" data-id="${g.id}" aria-label="Edit gift">${icon("edit")}</button><button class="mini-icon" type="button" data-action="delete-gift" data-id="${g.id}" aria-label="Delete gift">${icon("trash")}</button></div><h3>${esc(g.person)}</h3><div class="idea">${esc(g.idea)}</div><div class="price private-value">${money(g.price)}</div><div class="tag-row">${g.priority?`<span class="tag ${g.priority==="high"?"warn":""}">${g.priority==="high"?"⭐":"•"} ${esc(g.priority)} priority</span>`:""}${g.store?`<span class="tag">🏬 ${esc(g.store)}</span>`:""}${duplicate?`<span class="tag warn">Duplicate idea?</span>`:""}</div><div class="gift-stage"><button class="stage-btn ${g.purchased?"active":""}" type="button" data-action="gift-stage" data-stage="purchased" data-id="${g.id}"><span>${g.purchased?"✓":"🛍️"}</span>Purchased</button><button class="stage-btn ${g.delivered?"active":""}" type="button" data-action="gift-stage" data-stage="delivered" data-id="${g.id}"><span>${g.delivered?"✓":"📦"}</span>Delivered</button><button class="stage-btn ${g.wrapped?"active":""}" type="button" data-action="gift-stage" data-stage="wrapped" data-id="${g.id}"><span>${g.wrapped?"✓":"🎀"}</span>Wrapped</button></div>${g.hidden?`<div class="secret">🤫 Hidden: ${esc(g.hidden)}</div>`:""}${g.notes?`<p style="font-size:.72rem;color:var(--muted);margin:9px 0 0">${esc(g.notes)}</p>`:""}</article>`}
    function renderBudget(){const b=budgetStats(),parts=[b.gifts,b.groceries,b.expenses],base=Math.max(1,b.spent),a=parts[0]/base*100,c=(parts[0]+parts[1])/base*100,cats={};state.expenses.forEach(x=>cats[x.category]=(cats[x.category]||0)+moneyNum(x.amount));return `<section class="screen">${demoBanner()}<div class="budget-hero"><div class="budget-total"><span>Remaining holiday budget</span><strong class="private-value">${money(b.remaining)}</strong><small>${b.remaining<0?`${money(Math.abs(b.remaining))} over plan`:`${Math.round(b.percent)}% of budget used`}</small></div><div class="budget-mini"><span>Total budget</span><strong class="private-value">${money(b.total)}</strong></div><div class="budget-mini"><span>Spent &amp; committed</span><strong class="private-value">${money(b.spent)}</strong></div><div class="budget-mini"><span>Deal savings</span><strong class="private-value gold">${money(dealSavings())}</strong></div></div><div class="button-row" style="margin:15px 0"><button class="btn btn-primary" type="button" data-action="edit-budget">Edit total budget</button><button class="btn" type="button" data-action="add-expense">${icon("plus")} Add expense</button></div><div class="grid grid-main"><div class="stack"><article class="card"><div class="card-head"><div><h2 class="card-title">Spending breakdown</h2><p class="card-sub">Purchased gifts + checked groceries + manual expenses.</p></div></div><div class="chart-wrap"><div class="donut" style="--a:${a}%;--b:${c}%"><div class="donut-copy"><strong class="private-value">${money(b.spent)}</strong><span>tracked spend</span></div></div><div class="legend"><div class="legend-row"><i class="dot" style="--c:var(--green)"></i>Purchased gifts<strong class="private-value">${money(b.gifts)}</strong></div><div class="legend-row"><i class="dot" style="--c:var(--red)"></i>Groceries<strong class="private-value">${money(b.groceries)}</strong></div><div class="legend-row"><i class="dot" style="--c:var(--gold)"></i>Other expenses<strong class="private-value">${money(b.expenses)}</strong></div></div></div></article><article class="card"><div class="card-head"><div><h2 class="card-title">Expense log</h2><p class="card-sub">Extra holiday spending outside gifts and groceries.</p></div><button class="btn btn-small btn-soft" type="button" data-action="add-expense">Add expense</button></div><div class="row-list">${state.expenses.map(expenseRow).join("")||empty("🧾","No extra expenses","Gift and grocery totals still update automatically.")}</div></article></div><aside class="stack"><article class="card"><div class="card-head"><div><h2 class="card-title">Budget categories</h2><p class="card-sub">Manual expenses by category.</p></div></div>${Object.keys(cats).length?Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>progressBar(k,v,Math.max(b.total,1),"var(--gold)")).join(""):empty("📊","No category data yet","Add an expense to see the breakdown.")}</article><article class="card"><div class="card-head"><div><h2 class="card-title">Calculation note</h2></div></div><p class="card-sub" style="font-size:.76rem;line-height:1.6">Orders are not added automatically because the same purchase may already exist as a gift. Add non-gift orders to the Expense Log if they should count toward the budget.</p></article></aside></div></section>`}
    function expenseRow(x){return `<div class="row"><div class="row-icon">🧾</div><div class="row-main"><strong>${esc(x.item)}</strong><span>${esc(x.category)}${x.date?` · ${fmtDate(x.date)}`:""}</span></div><span class="row-value private-value">${money(x.amount)}</span><div class="row-actions"><button class="mini-icon" type="button" data-action="edit-expense" data-id="${x.id}" aria-label="Edit expense">${icon("edit")}</button><button class="mini-icon" type="button" data-action="delete-expense" data-id="${x.id}" aria-label="Delete expense">${icon("trash")}</button></div></div>`}
    function dealSavings(){return state.deals.filter(d=>d.status==="claimed").reduce((n,d)=>n+Math.max(0,moneyNum(d.regular)-moneyNum(d.sale)),0)}
    function renderShopping(){return `<section class="screen">${demoBanner()}<div class="tabs"><button class="tab ${shoppingTab==="deals"?"active":""}" type="button" data-action="shopping-tab" data-tab="deals">🏷️ Deal Watch</button><button class="tab ${shoppingTab==="orders"?"active":""}" type="button" data-action="shopping-tab" data-tab="orders">📦 Order Tracker</button></div>${shoppingTab==="deals"?renderDeals():renderOrders()}</section>`}
    function renderDeals(){const watching=state.deals.filter(d=>d.status==="watching").length;return `<article class="card"><div class="card-head"><div><h2 class="card-title">Black Friday &amp; Cyber Monday Deal Watch</h2><p class="card-sub">Keep regular prices beside sale prices so a “deal” is easy to judge.</p></div><button class="btn btn-red" type="button" data-action="add-deal">${icon("plus")} Add deal</button></div><div class="kpis" style="margin-bottom:16px"><div class="kpi"><span>Watching</span><strong>${watching}</strong><small>active deals</small></div><div class="kpi"><span>Claimed</span><strong>${state.deals.filter(d=>d.status==="claimed").length}</strong><small>purchases made</small></div><div class="kpi"><span>Total saved</span><strong class="private-value gold">${money(dealSavings())}</strong><small>claimed deals</small></div><div class="kpi"><span>Ending soon</span><strong>${state.deals.filter(d=>d.status==="watching"&&d.deadline&&d.deadline<=addDays(today(),3)&&d.deadline>=today()).length}</strong><small>within 3 days</small></div></div><div class="item-grid">${state.deals.map(renderDealCard).join("")||empty("🏷️","No deals watched","Add an item before the sale rush begins.")}</div></article>`}
    function renderDealCard(d){const save=Math.max(0,moneyNum(d.regular)-moneyNum(d.sale)),ended=d.deadline&&d.deadline<today()&&d.status==="watching";return `<article class="item-card"><div class="item-card-head"><div class="item-emoji">🏷️</div><div class="item-card-main"><strong>${esc(d.item)}</strong><span>${esc(d.store||"Store not set")}</span></div><button class="mini-icon" type="button" data-action="edit-deal" data-id="${d.id}" aria-label="Edit deal">${icon("edit")}</button><button class="mini-icon" type="button" data-action="delete-deal" data-id="${d.id}" aria-label="Delete deal">${icon("trash")}</button></div><div class="divider"></div><div style="display:flex;justify-content:space-between;gap:10px"><div><span class="card-meta">Regular</span><strong class="private-value" style="display:block">${money(d.regular)}</strong></div><div><span class="card-meta">Sale</span><strong class="private-value gold" style="display:block">${money(d.sale)}</strong></div><div><span class="card-meta">Save</span><strong class="private-value positive" style="display:block">${money(save)}</strong></div></div><div class="tag-row"><span class="status ${d.status==="claimed"?"good":ended||d.status==="missed"?"warn":"gold-status"}">${d.status==="claimed"?"✓ Claimed":d.status==="missed"?"Missed":"Watching"}</span>${d.deadline?`<span class="tag ${ended?"warn":""}">Ends ${fmtDate(d.deadline)}</span>`:""}</div>${d.notes?`<p>${esc(d.notes)}</p>`:""}<div class="button-row" style="margin-top:11px"><button class="btn btn-small btn-soft" type="button" data-action="cycle-deal" data-id="${d.id}">Change status</button>${d.url?`<a class="btn btn-small btn-ghost" href="${safeUrl(d.url)}" target="_blank" rel="noopener">${icon("link")} Open link</a>`:""}</div></article>`}
    function safeUrl(url){const s=String(url||"").trim();return /^(https?:\/\/)/i.test(s)?esc(s):"#"}
    function renderOrders(){const late=state.orders.filter(o=>!o.delivered&&o.eta&&o.eta<today()).length;return `<article class="card"><div class="card-head"><div><h2 class="card-title">Online Order &amp; Delivery Tracker</h2><p class="card-sub">Keep tracking numbers, recipients and expected dates together.</p></div><button class="btn btn-primary" type="button" data-action="add-order">${icon("plus")} Track order</button></div><div class="kpis" style="margin-bottom:16px"><div class="kpi"><span>Open orders</span><strong>${state.orders.filter(o=>!o.delivered).length}</strong><small>still travelling</small></div><div class="kpi"><span>Delivered</span><strong>${state.orders.filter(o=>o.delivered).length}</strong><small>arrived safely</small></div><div class="kpi"><span>Past ETA</span><strong class="${late?"negative":""}">${late}</strong><small>needs checking</small></div><div class="kpi"><span>Order value</span><strong class="private-value">${money(state.orders.reduce((n,o)=>n+moneyNum(o.amount),0))}</strong><small>reference only</small></div></div><div class="item-grid">${state.orders.map(renderOrderCard).join("")||empty("📦","No orders tracked","Add an online order and its expected arrival date.")}</div></article>`}
    function renderOrderCard(o){const late=!o.delivered&&o.eta&&o.eta<today();return `<article class="item-card"><div class="item-card-head"><div class="item-emoji">${o.delivered?"✅":"📦"}</div><div class="item-card-main"><strong>${esc(o.item)}</strong><span>${esc(o.store||"Store not set")}${o.forPerson?` · for ${esc(o.forPerson)}`:""}</span></div><button class="mini-icon" type="button" data-action="edit-order" data-id="${o.id}" aria-label="Edit order">${icon("edit")}</button><button class="mini-icon" type="button" data-action="delete-order" data-id="${o.id}" aria-label="Delete order">${icon("trash")}</button></div><div class="tag-row"><span class="status ${o.delivered?"good":late?"warn":"gold-status"}">${o.delivered?"Delivered":late?"Past ETA":"In transit"}</span>${o.eta?`<span class="tag">ETA ${fmtDate(o.eta)}</span>`:""}${o.tracking?`<span class="tag"># ${esc(o.tracking)}</span>`:""}</div><p class="private-value" style="font-weight:800;color:var(--gold)">${money(o.amount)}</p><div class="button-row"><button class="btn btn-small ${o.delivered?"btn-soft":"btn-primary"}" type="button" data-action="toggle-order" data-id="${o.id}">${o.delivered?"Mark in transit":"Mark delivered"}</button></div></article>`}
    function renderHosting(){return `<section class="screen">${demoBanner()}<div class="tabs"><button class="tab ${hostingTab==="meals"?"active":""}" type="button" data-action="hosting-tab" data-tab="meals">🍽️ Meals</button><button class="tab ${hostingTab==="groceries"?"active":""}" type="button" data-action="hosting-tab" data-tab="groceries">🛒 Groceries</button><button class="tab ${hostingTab==="guests"?"active":""}" type="button" data-action="hosting-tab" data-tab="guests">🥂 Guests</button></div>${hostingTab==="meals"?renderMeals():hostingTab==="groceries"?renderGroceries():renderGuests()}</section>`}
    function renderMeals(){return `<article class="card"><div class="card-head"><div><h2 class="card-title">Christmas Meal Planner</h2><p class="card-sub">Plan the menu without trying to hold every dish in your head.</p></div><button class="btn btn-primary" type="button" data-action="add-meal">${icon("plus")} Add dish</button></div><div class="item-grid">${state.meals.map(m=>`<article class="item-card"><div class="item-card-head"><div class="item-emoji">🍽️</div><div class="item-card-main"><strong>${esc(m.name)}</strong><span>${esc(m.type||"Dish")}${m.servings?` · serves ${esc(m.servings)}`:""}</span></div><button class="mini-icon" type="button" data-action="edit-meal" data-id="${m.id}" aria-label="Edit dish">${icon("edit")}</button><button class="mini-icon" type="button" data-action="delete-meal" data-id="${m.id}" aria-label="Delete dish">${icon("trash")}</button></div><div class="tag-row">${m.date?`<span class="tag">📅 ${fmtDate(m.date)}</span>`:""}${m.assignee?`<span class="tag">👤 ${esc(m.assignee)}</span>`:""}</div>${m.notes?`<p>${esc(m.notes)}</p>`:""}</article>`).join("")||empty("🍽️","No dishes planned","Add the main meal, dessert or a make-ahead item.")}</div></article>`}
    function renderGroceries(){const bought=state.groceries.filter(g=>g.purchased).length;return `<article class="card"><div class="card-head"><div><h2 class="card-title">Holiday Grocery List</h2><p class="card-sub">Checked items automatically count toward the holiday budget.</p></div><button class="btn btn-primary" type="button" data-action="add-grocery">${icon("plus")} Add grocery</button></div><div class="kpis" style="margin-bottom:15px"><div class="kpi"><span>Purchased</span><strong>${bought}/${state.groceries.length}</strong><small>shopping progress</small></div><div class="kpi"><span>Purchased cost</span><strong class="private-value">${money(state.groceries.filter(g=>g.purchased).reduce((n,g)=>n+moneyNum(g.cost),0))}</strong><small>included in budget</small></div><div class="kpi"><span>Still needed</span><strong>${state.groceries.length-bought}</strong><small>open items</small></div><div class="kpi"><span>Est. full list</span><strong class="private-value">${money(state.groceries.reduce((n,g)=>n+moneyNum(g.cost),0))}</strong><small>if all purchased</small></div></div><div class="grid grid-2">${groupGroceries()}</div></article>`}
    function groupGroceries(){const groups={};state.groceries.forEach(g=>(groups[g.category||"Other"]??=[]).push(g));return Object.keys(groups).length?Object.entries(groups).map(([cat,items])=>`<div class="card compact"><div class="card-head"><div><h3 class="card-title">${esc(cat)}</h3><p class="card-sub">${items.filter(x=>x.purchased).length}/${items.length} purchased</p></div></div>${items.map(g=>`<div class="checkline ${g.purchased?"done":""}"><button class="soft-check ${g.purchased?"done":""}" type="button" data-action="toggle-grocery" data-id="${g.id}">${g.purchased?icon("check"):""}</button><div class="checkline-main"><strong>${esc(g.item)}</strong><span>${esc(g.qty||"")}${g.cost?` · ${money(g.cost)}`:""}</span></div><button class="mini-icon" type="button" data-action="edit-grocery" data-id="${g.id}" aria-label="Edit grocery">${icon("edit")}</button><button class="mini-icon" type="button" data-action="delete-grocery" data-id="${g.id}" aria-label="Delete grocery">${icon("trash")}</button></div>`).join("")}</div>`).join(""):empty("🛒","Grocery list is empty","Add ingredients, drinks or party supplies.")}
    function renderGuests(){const yes=state.guests.filter(g=>g.rsvp==="yes").length,maybe=state.guests.filter(g=>g.rsvp==="maybe").length;return `<article class="card"><div class="card-head"><div><h2 class="card-title">Party &amp; Guest Planner</h2><p class="card-sub">RSVPs, dietary notes and contact details in one view.</p></div><button class="btn btn-red" type="button" data-action="add-guest">${icon("plus")} Add guest</button></div><div class="kpis" style="margin-bottom:15px"><div class="kpi"><span>Total invited</span><strong>${state.guests.length}</strong></div><div class="kpi"><span>Attending</span><strong class="positive">${yes}</strong></div><div class="kpi"><span>Maybe</span><strong class="gold">${maybe}</strong></div><div class="kpi"><span>Dietary notes</span><strong>${state.guests.filter(g=>g.dietary).length}</strong></div></div><div class="item-grid">${state.guests.map(g=>`<article class="item-card"><div class="item-card-head"><div class="item-emoji">🥂</div><div class="item-card-main"><strong>${esc(g.name)}</strong><span>${esc(g.event||"Christmas gathering")}</span></div><button class="mini-icon" type="button" data-action="edit-guest" data-id="${g.id}" aria-label="Edit guest">${icon("edit")}</button><button class="mini-icon" type="button" data-action="delete-guest" data-id="${g.id}" aria-label="Delete guest">${icon("trash")}</button></div><div class="tag-row"><span class="status ${g.rsvp==="yes"?"good":g.rsvp==="no"?"warn":"gold-status"}">RSVP: ${esc(g.rsvp||"waiting")}</span>${g.dietary?`<span class="tag">🥗 ${esc(g.dietary)}</span>`:""}</div>${g.contact?`<p class="private-value">${esc(g.contact)}</p>`:""}</article>`).join("")||empty("🥂","No guests yet","Add guests and track their replies.")}</div></article>`}
    function renderCardsDecor(){return `<section class="screen">${demoBanner()}<div class="tabs"><button class="tab ${cardsTab==="cards"?"active":""}" type="button" data-action="cards-tab" data-tab="cards">💌 Christmas Cards</button><button class="tab ${cardsTab==="decor"?"active":""}" type="button" data-action="cards-tab" data-tab="decor">🕯️ Decorating</button><button class="tab ${cardsTab==="timeline"?"active":""}" type="button" data-action="cards-tab" data-tab="timeline">📅 Holiday Timeline</button></div>${cardsTab==="cards"?renderCardList():cardsTab==="decor"?renderDecor():renderTimeline()}</section>`}
    function renderCardList(){return `<article class="card"><div class="card-head"><div><h2 class="card-title">Christmas Cards &amp; Address List</h2><p class="card-sub">Track each card from list to written to sent.</p></div><button class="btn btn-red" type="button" data-action="add-card">${icon("plus")} Add recipient</button></div><div class="kpis" style="margin-bottom:15px"><div class="kpi"><span>Recipients</span><strong>${state.cards.length}</strong></div><div class="kpi"><span>Written</span><strong>${state.cards.filter(c=>["written","sent"].includes(c.status)).length}</strong></div><div class="kpi"><span>Sent</span><strong class="positive">${state.cards.filter(c=>c.status==="sent").length}</strong></div><div class="kpi"><span>Still listed</span><strong>${state.cards.filter(c=>c.status==="list").length}</strong></div></div><div class="item-grid">${state.cards.map(c=>`<article class="item-card"><div class="item-card-head"><div class="item-emoji">💌</div><div class="item-card-main"><strong>${esc(c.name)}</strong><span class="private-value">${esc(c.address||"No address yet")}</span></div><button class="mini-icon" type="button" data-action="edit-card" data-id="${c.id}" aria-label="Edit card recipient">${icon("edit")}</button><button class="mini-icon" type="button" data-action="delete-card" data-id="${c.id}" aria-label="Delete card recipient">${icon("trash")}</button></div><div class="tag-row"><span class="status ${c.status==="sent"?"good":c.status==="written"?"gold-status":""}">${c.status==="sent"?"✓ Sent":c.status==="written"?"Written":"On list"}</span></div><button class="btn btn-small btn-soft" style="margin-top:11px" type="button" data-action="cycle-card" data-id="${c.id}">Next status</button></article>`).join("")||empty("💌","No card recipients","Add a name and mailing address.")}</div></article>`}
    function renderDecor(){const rooms={};state.decor.forEach(d=>(rooms[d.room||"Other"]??=[]).push(d));return `<article class="card"><div class="card-head"><div><h2 class="card-title">Decorating Checklist by Room</h2><p class="card-sub">See what goes where—and where it returns after Christmas.</p></div><button class="btn btn-primary" type="button" data-action="add-decor">${icon("plus")} Add decoration</button></div><div class="grid grid-2">${Object.keys(rooms).length?Object.entries(rooms).map(([room,items])=>`<div class="card compact"><div class="card-head"><div><h3 class="card-title">${esc(room)}</h3><p class="card-sub">${items.filter(x=>x.done).length}/${items.length} placed</p></div></div>${items.map(d=>`<div class="checkline ${d.done?"done":""}"><button class="soft-check ${d.done?"done":""}" type="button" data-action="toggle-decor" data-id="${d.id}">${d.done?icon("check"):""}</button><div class="checkline-main"><strong>${esc(d.item)}</strong><span>${d.storage?`Stored: ${esc(d.storage)}`:"No storage note"}</span></div><button class="mini-icon" type="button" data-action="edit-decor" data-id="${d.id}" aria-label="Edit decoration">${icon("edit")}</button><button class="mini-icon" type="button" data-action="delete-decor" data-id="${d.id}" aria-label="Delete decoration">${icon("trash")}</button></div>`).join("")}</div>`).join(""):empty("🕯️","No decorations listed","Add the tree, lights or a room detail.")}</div></article>`}
    function renderTimeline(){const list=getTimeline();return `<article class="card"><div class="card-head"><div><h2 class="card-title">Holiday Timeline</h2><p class="card-sub">Dates from tasks, orders, deals and meals come together automatically.</p></div></div>${list.length?`<div class="timeline">${list.map(x=>`<div class="timeline-item"><strong>${esc(x.title)}</strong><span>${fmtDate(x.date,{weekday:"short",day:"numeric",month:"short",year:"numeric"})} · ${esc(x.type)}</span></div>`).join("")}</div>`:empty("📅","Timeline is open","Add dates elsewhere and they will appear here.")}</article>`}
    function renderBrain(){return `<section class="screen">${demoBanner()}<article class="card" style="margin-bottom:17px"><div class="card-head"><div><h2 class="card-title">Brain Snowglobe</h2><p class="card-sub">Catch the thought now. Decide what it means later.</p></div></div><form data-form="brain-inline"><div class="form-grid"><div class="field full"><label for="brainText">What is circling in your head?</label><textarea class="textarea" id="brainText" name="text" maxlength="1200" required placeholder="Type the thought, reminder, link or idea…"></textarea></div><div class="field"><label for="brainCategory">Label</label><select class="select" id="brainCategory" name="category"><option>Thought</option><option>Gift idea</option><option>Shopping</option><option>Food</option><option>People</option><option>Later</option></select></div></div><div class="modal-foot"><button class="btn btn-primary" type="submit">Save thought</button></div></form></article><article class="card"><div class="card-head"><div><h2 class="card-title">Stored thoughts</h2><p class="card-sub">Convert any note into a Christmas task.</p></div></div><div class="brain-grid">${state.brain.map(n=>`<article class="brain-note"><div class="note-meta"><span class="tag">${esc(n.category)}</span><span>${fmtDate(n.date)}</span></div><p>${esc(n.text)}</p><div class="note-actions"><button class="btn btn-small btn-soft" type="button" data-action="convert-brain" data-id="${n.id}">Convert to task</button><button class="mini-icon" type="button" data-action="edit-brain" data-id="${n.id}" aria-label="Edit thought">${icon("edit")}</button><button class="mini-icon" type="button" data-action="delete-brain" data-id="${n.id}" aria-label="Delete thought">${icon("trash")}</button></div></article>`).join("")||empty("❄️","The snowglobe is clear","Your next loose thought can rest here.")}</div></article></section>`}
    function renderSettings(){return `<section class="screen"><div class="grid grid-2"><article class="card"><div class="card-head"><div><h2 class="card-title">Christmas details</h2><p class="card-sub">Update the date, name and planning budget.</p></div></div><form data-form="profile"><div class="form-grid"><div class="field"><label for="profileName">Your name</label><input class="input" id="profileName" name="name" maxlength="40" required value="${esc(state.profile.name)}"></div><div class="field"><label for="profileHousehold">Planner name</label><input class="input" id="profileHousehold" name="household" maxlength="60" required value="${esc(state.profile.household)}"></div><div class="field"><label for="profileDate">Christmas date</label><input class="input" id="profileDate" name="christmasDate" type="date" required value="${esc(state.profile.christmasDate)}"></div><div class="field"><label for="profileCurrency">Currency</label><select class="select" id="profileCurrency" name="currency">${Object.entries(CURRENCIES).map(([k,v])=>`<option value="${k}" ${k===state.settings.currency?"selected":""}>${v[0]} ${v[1]}</option>`).join("")}</select></div><div class="field full"><label for="profileBudget">Holiday budget</label><input class="input" id="profileBudget" name="budget" type="number" min="0" step="0.01" value="${moneyNum(state.budget.total)}"></div></div><div class="modal-foot"><button class="btn btn-primary" type="submit">Save details</button></div></form></article><article class="card"><div class="card-head"><div><h2 class="card-title">Christmas themes</h2><p class="card-sub">Both themes keep the same comfortable neumorphic layout.</p></div></div><div class="theme-grid"><button class="theme-choice ${state.settings.theme==="light"?"active":""}" type="button" data-action="set-theme" data-theme="light"><div class="swatch" style="--swatch:linear-gradient(135deg,#edf1eb,#dce5dc,#a8474d)"></div><strong>Snowy Day</strong></button><button class="theme-choice ${state.settings.theme==="night"?"active":""}" type="button" data-action="set-theme" data-theme="night"><div class="swatch" style="--swatch:linear-gradient(135deg,#10231b,#285644,#b85c63)"></div><strong>Evergreen Night</strong></button></div><div class="divider"></div><div class="switch-row"><div class="switch-copy"><strong>Background motion</strong><span>Soft snowfall and celebration animation.</span></div><button class="switch ${state.settings.motion?"on":""}" type="button" data-action="toggle-motion" aria-pressed="${state.settings.motion}"></button></div><div class="switch-row"><div class="switch-copy"><strong>Surprise shield</strong><span>Blur prices, addresses and gift hiding places.</span></div><button class="switch ${state.settings.surprise?"on":""}" type="button" data-action="toggle-surprise" aria-pressed="${state.settings.surprise}"></button></div></article><article class="card"><div class="card-head"><div><h2 class="card-title">Your data</h2><p class="card-sub">Everything saves automatically in this browser.</p></div><span class="status ${storageWorks?"good":"warn"}">${storageWorks?"Auto-save ready":"Session only"}</span></div><div class="button-row"><button class="btn btn-soft" type="button" data-action="export">${icon("download")} Download backup</button><button class="btn" type="button" data-action="import">${icon("upload")} Restore backup</button><button class="btn" type="button" data-action="print">${icon("printer")} Print</button></div><p class="card-sub" style="margin-top:13px;line-height:1.6">A backup includes every list, status, setting and budget entry. Keep one before changing browsers or devices.</p></article><article class="card"><div class="card-head"><div><h2 class="card-title">Seller Demo Mode</h2><p class="card-sub">Useful when you make a separate preview copy for Etsy shoppers.</p></div></div><div class="switch-row"><div class="switch-copy"><strong>Limit new entries</strong><span>Maximum ${DEMO_LIMITS.tasks} tasks and ${DEMO_LIMITS.gifts} gifts. Existing items are never deleted.</span></div><button class="switch on" type="button" disabled aria-pressed="true" title="Locked in demo copy"></button></div><p class="card-sub" style="margin-top:12px">This public preview is permanently limited to 20 tasks and 10 gifts. Purchase the full planner for unlimited entries.
      <a href="https://www.etsy.com/shop/PaperLoombyHasnain?etsrc=sdt" target="_blank" style="text-decoration: none;">
    <button style="background-color: #4CAF50; color: white; padding: 12px 24px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px;">
        Visit My Shop
    </button>
</a>
</p></article><article class="card"><div class="card-head"><div><h2 class="card-title">Fresh start</h2><p class="card-sub">Erase this browser’s planner and return to setup.</p></div></div><button class="btn btn-danger" type="button" data-action="reset">Erase everything</button><p class="card-sub" style="margin-top:11px">You will be asked to type RESET. There is no undo without a backup.</p></article><article class="card"><div class="card-head"><div><h2 class="card-title">Planner edition</h2><p class="card-sub">Offline HTML planner by paperloombyhasnain.</p></div></div><div class="tag-row"><span class="tag">Windows</span><span class="tag">Mac</span><span class="tag">Android</span><span class="tag">iPhone &amp; iPad</span></div></article></div></section>`}
    function openModal(title,subtitle,body,wide=false){const layer=$("#modalLayer");layer.hidden=false;layer.innerHTML=`<div class="scrim" data-action="close-modal"></div><section class="modal ${wide?"wide":""}" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><header class="modal-head"><div><h2 id="modalTitle">${esc(title)}</h2>${subtitle?`<p>${esc(subtitle)}</p>`:""}</div><button class="mini-icon" type="button" data-action="close-modal" aria-label="Close">${icon("close")}</button></header><div class="modal-body">${body}</div></section>`;hydrateIcons(layer);setTimeout(()=>$("input:not([type=hidden]),textarea,select",layer)?.focus(),40)}
    function closeModal(){$("#modalLayer").hidden=true;$("#modalLayer").innerHTML="";confirmAction=null}
    function formFoot(label){return `<div class="modal-foot"><button class="btn btn-ghost" type="button" data-action="close-modal">Cancel</button><button class="btn btn-primary" type="submit">${esc(label)}</button></div>`}
    function taskModal(id=null,prefill={}){if(!id&&demoBlocked("tasks"))return;const t=id?state.tasks.find(x=>x.id===id):null,energy=t?.energy||prefill.energy||currentEnergy(),category=t?.category||prefill.category||"other";openModal(t?"Edit Christmas task":"Add a Christmas task","Make the action clear and choose the energy it needs.",`<form data-form="task"><input type="hidden" name="id" value="${t?.id||""}"><input type="hidden" name="convertId" value="${prefill.convertId||""}"><div class="form-grid"><div class="field full"><label for="taskTitle">Task</label><input class="input" id="taskTitle" name="title" maxlength="120" required value="${esc(t?.title||prefill.title||"")}" placeholder="What is the next visible action?"></div><div class="field"><label for="taskEnergy">Energy needed</label><select class="select" id="taskEnergy" name="energy">${Object.entries(ENERGY).map(([k,v])=>`<option value="${k}" ${k===energy?"selected":""}>${v.icon} ${v.name}</option>`).join("")}</select></div><div class="field"><label for="taskCategory">Category</label><select class="select" id="taskCategory" name="category">${Object.entries(CATEGORY).map(([k,v])=>`<option value="${k}" ${k===category?"selected":""}>${v[1]} ${v[0]}</option>`).join("")}</select></div><div class="field"><label for="taskDue">Due date (optional)</label><input class="input" id="taskDue" name="due" type="date" value="${esc(t?.due||"")}"></div><div class="field full"><label for="taskNotes">Starting clue (optional)</label><textarea class="textarea" id="taskNotes" name="notes" maxlength="600" placeholder="A tiny first step, link or reminder…">${esc(t?.notes||prefill.notes||"")}</textarea></div></div>${formFoot(t?"Save changes":"Add task")}</form>`)}
    function giftModal(id=null){if(!id&&demoBlocked("gifts"))return;const g=id?state.gifts.find(x=>x.id===id):null;openModal(g?"Edit gift":"Add a gift","Track the surprise from idea to wrapped.",`<form data-form="gift"><input type="hidden" name="id" value="${g?.id||""}"><div class="form-grid"><div class="field"><label for="giftPerson">Person</label><input class="input" id="giftPerson" name="person" maxlength="80" required value="${esc(g?.person||"")}" placeholder="Who is it for?"></div><div class="field"><label for="giftIdea">Gift idea</label><input class="input" id="giftIdea" name="idea" maxlength="120" required value="${esc(g?.idea||"")}" placeholder="What are you considering?"></div><div class="field"><label for="giftPrice">Price</label><input class="input" id="giftPrice" name="price" type="number" min="0" step="0.01" value="${moneyNum(g?.price)}"></div><div class="field"><label for="giftPriority">Priority</label><select class="select" id="giftPriority" name="priority"><option value="low" ${g?.priority==="low"?"selected":""}>Low</option><option value="medium" ${!g||g.priority==="medium"?"selected":""}>Medium</option><option value="high" ${g?.priority==="high"?"selected":""}>High</option></select></div><div class="field"><label for="giftStore">Store</label><input class="input" id="giftStore" name="store" maxlength="100" value="${esc(g?.store||"")}" placeholder="Shop or website"></div><div class="field"><label for="giftHidden">Where I hid it</label><input class="input" id="giftHidden" name="hidden" maxlength="120" value="${esc(g?.hidden||"")}" placeholder="e.g. Hall closet, top shelf"></div><div class="field full"><label for="giftLink">Product link (optional)</label><input class="input" id="giftLink" name="link" type="url" value="${esc(g?.link||"")}" placeholder="https://…"></div><div class="field full"><label for="giftNotes">Notes</label><textarea class="textarea" id="giftNotes" name="notes" maxlength="500">${esc(g?.notes||"")}</textarea></div><label class="check-choice"><input type="checkbox" name="purchased" ${g?.purchased?"checked":""}> Purchased</label><label class="check-choice"><input type="checkbox" name="delivered" ${g?.delivered?"checked":""}> Delivered</label><label class="check-choice"><input type="checkbox" name="wrapped" ${g?.wrapped?"checked":""}> Wrapped</label></div>${formFoot(g?"Save gift":"Add gift")}</form>`,true)}
    function budgetModal(){openModal("Edit holiday budget","Set one overall spending limit. This does not connect to a bank.",`<form data-form="budget"><div class="field"><label for="budgetTotal">Total holiday budget</label><input class="input" id="budgetTotal" name="total" type="number" min="0" step="0.01" required value="${moneyNum(state.budget.total)}"></div>${formFoot("Save budget")}</form>`)}
    function expenseModal(id=null){const x=id?state.expenses.find(v=>v.id===id):null;openModal(x?"Edit expense":"Add holiday expense","Use this for spending outside purchased gifts and checked groceries.",`<form data-form="expense"><input type="hidden" name="id" value="${x?.id||""}"><div class="form-grid"><div class="field full"><label for="expenseItem">Item or expense</label><input class="input" id="expenseItem" name="item" maxlength="100" required value="${esc(x?.item||"")}" placeholder="e.g. Gift wrap and tape"></div><div class="field"><label for="expenseCategory">Category</label><input class="input" id="expenseCategory" name="category" maxlength="60" required value="${esc(x?.category||"Other")}"></div><div class="field"><label for="expenseAmount">Amount</label><input class="input" id="expenseAmount" name="amount" type="number" min="0" step="0.01" required value="${moneyNum(x?.amount)}"></div><div class="field"><label for="expenseDate">Date</label><input class="input" id="expenseDate" name="date" type="date" value="${esc(x?.date||today())}"></div><div class="field full"><label for="expenseNotes">Notes</label><textarea class="textarea" id="expenseNotes" name="notes" maxlength="400">${esc(x?.notes||"")}</textarea></div></div>${formFoot(x?"Save expense":"Add expense")}</form>`)}
    function dealModal(id=null){const d=id?state.deals.find(x=>x.id===id):null;openModal(d?"Edit deal":"Watch a deal","Compare the real regular and sale prices.",`<form data-form="deal"><input type="hidden" name="id" value="${d?.id||""}"><div class="form-grid"><div class="field full"><label for="dealItem">Item</label><input class="input" id="dealItem" name="item" maxlength="120" required value="${esc(d?.item||"")}"></div><div class="field"><label for="dealStore">Store</label><input class="input" id="dealStore" name="store" maxlength="100" value="${esc(d?.store||"")}"></div><div class="field"><label for="dealDeadline">Sale deadline</label><input class="input" id="dealDeadline" name="deadline" type="date" value="${esc(d?.deadline||"")}"></div><div class="field"><label for="dealRegular">Regular price</label><input class="input" id="dealRegular" name="regular" type="number" min="0" step="0.01" value="${moneyNum(d?.regular)}"></div><div class="field"><label for="dealSale">Sale price</label><input class="input" id="dealSale" name="sale" type="number" min="0" step="0.01" value="${moneyNum(d?.sale)}"></div><div class="field full"><label for="dealUrl">Link</label><input class="input" id="dealUrl" name="url" type="url" value="${esc(d?.url||"")}" placeholder="https://…"></div><div class="field"><label for="dealStatus">Status</label><select class="select" id="dealStatus" name="status"><option value="watching" ${!d||d.status==="watching"?"selected":""}>Watching</option><option value="claimed" ${d?.status==="claimed"?"selected":""}>Claimed</option><option value="missed" ${d?.status==="missed"?"selected":""}>Missed</option></select></div><div class="field full"><label for="dealNotes">Notes</label><textarea class="textarea" id="dealNotes" name="notes" maxlength="400">${esc(d?.notes||"")}</textarea></div></div>${formFoot(d?"Save deal":"Add deal")}</form>`)}
    function orderModal(id=null){const o=id?state.orders.find(x=>x.id===id):null;openModal(o?"Edit order":"Track an order","The amount is for reference and is not automatically added to the budget.",`<form data-form="order"><input type="hidden" name="id" value="${o?.id||""}"><div class="form-grid"><div class="field full"><label for="orderItem">Item</label><input class="input" id="orderItem" name="item" maxlength="120" required value="${esc(o?.item||"")}"></div><div class="field"><label for="orderStore">Store</label><input class="input" id="orderStore" name="store" maxlength="100" value="${esc(o?.store||"")}"></div><div class="field"><label for="orderPerson">For person</label><input class="input" id="orderPerson" name="forPerson" maxlength="80" value="${esc(o?.forPerson||"")}"></div><div class="field"><label for="orderAmount">Amount</label><input class="input" id="orderAmount" name="amount" type="number" min="0" step="0.01" value="${moneyNum(o?.amount)}"></div><div class="field"><label for="orderDate">Ordered date</label><input class="input" id="orderDate" name="ordered" type="date" value="${esc(o?.ordered||today())}"></div><div class="field"><label for="orderEta">Expected delivery</label><input class="input" id="orderEta" name="eta" type="date" value="${esc(o?.eta||"")}"></div><div class="field"><label for="orderTracking">Tracking number</label><input class="input" id="orderTracking" name="tracking" maxlength="120" value="${esc(o?.tracking||"")}"></div><label class="check-choice"><input type="checkbox" name="delivered" ${o?.delivered?"checked":""}> Delivered</label><div class="field full"><label for="orderNotes">Notes</label><textarea class="textarea" id="orderNotes" name="notes" maxlength="400">${esc(o?.notes||"")}</textarea></div></div>${formFoot(o?"Save order":"Track order")}</form>`)}
    function mealModal(id=null){const m=id?state.meals.find(x=>x.id===id):null;openModal(m?"Edit dish":"Add a dish","Plan the meal at a useful level of detail.",`<form data-form="meal"><input type="hidden" name="id" value="${m?.id||""}"><div class="form-grid"><div class="field full"><label for="mealName">Dish or meal</label><input class="input" id="mealName" name="name" maxlength="120" required value="${esc(m?.name||"")}"></div><div class="field"><label for="mealType">Type</label><select class="select" id="mealType" name="type">${["Breakfast","Starter","Main","Side","Dessert","Drink","Make-ahead"].map(x=>`<option ${m?.type===x?"selected":""}>${x}</option>`).join("")}</select></div><div class="field"><label for="mealServings">Servings</label><input class="input" id="mealServings" name="servings" maxlength="30" value="${esc(m?.servings||"")}" placeholder="e.g. 8"></div><div class="field"><label for="mealDate">Date</label><input class="input" id="mealDate" name="date" type="date" value="${esc(m?.date||state.profile.christmasDate)}"></div><div class="field"><label for="mealAssignee">Made by</label><input class="input" id="mealAssignee" name="assignee" maxlength="80" value="${esc(m?.assignee||"")}"></div><div class="field full"><label for="mealNotes">Recipe link, prep or notes</label><textarea class="textarea" id="mealNotes" name="notes" maxlength="600">${esc(m?.notes||"")}</textarea></div></div>${formFoot(m?"Save dish":"Add dish")}</form>`)}
    function groceryModal(id=null){const g=id?state.groceries.find(x=>x.id===id):null;openModal(g?"Edit grocery":"Add grocery item","Checked items count toward your budget.",`<form data-form="grocery"><input type="hidden" name="id" value="${g?.id||""}"><div class="form-grid"><div class="field full"><label for="groceryItem">Item</label><input class="input" id="groceryItem" name="item" maxlength="100" required value="${esc(g?.item||"")}"></div><div class="field"><label for="groceryQty">Quantity</label><input class="input" id="groceryQty" name="qty" maxlength="40" value="${esc(g?.qty||"")}" placeholder="e.g. 2 packs"></div><div class="field"><label for="groceryCategory">Category</label><select class="select" id="groceryCategory" name="category">${["Produce","Bakery","Meat","Dairy","Pantry","Drinks","Frozen","Party supplies","Other"].map(x=>`<option ${g?.category===x?"selected":""}>${x}</option>`).join("")}</select></div><div class="field"><label for="groceryCost">Estimated cost</label><input class="input" id="groceryCost" name="cost" type="number" min="0" step="0.01" value="${moneyNum(g?.cost)}"></div><label class="check-choice"><input type="checkbox" name="purchased" ${g?.purchased?"checked":""}> Purchased</label></div>${formFoot(g?"Save grocery":"Add grocery")}</form>`)}

  })();
